# This workflow is hand-maintained (adapted from cedar-py's CI.yml). Do NOT
# regenerate it with `maturin generate-ci` — that clobbers the commit-SHA
# action pins below. Every `uses:` ref is pinned to a commit SHA with the
# human-readable version tag in a trailing comment (e.g. `@<sha>  # v7.0.0`);
# the lint-workflows (zizmor) job enforces SHA pinning on every PR.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: 'true'
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: 3.13
      # Build an explicit interpreter list, not `--find-interpreter`: the
      # manylinux build images are unpinned and gain interpreters over time.
      # Add a new interpreter here deliberately, once pyo3 supports it.
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist
            -i python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15
            python3.14t python3.15t pypy3.11
          manylinux: auto
      # A missing interpreter must fail the build, not silently drop a wheel.
      - name: Check wheel count
        shell: bash
        run: test "$(ls dist/*.whl | wc -l)" -eq 10
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      # The full suite: stub check, corpus goldens, and parity against the
      # dogwood v1.1 CLI (built from the submodule by the test fixture).
      - name: tests (x86_64)
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        # disabling the PyPI index on `pip install pydogwood` to ensure we
        # install pydogwood from the local folder
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install pydogwood --no-index --find-links dist --force-reinstall
          pip install -r requirements.txt -r requirements.dev.txt
          make stubtest
          pytest
      # Under emulation, skip the CLI parity suite: building the reference
      # CLI with cargo inside qemu is far too slow.
      - name: tests (aarch64)
        if: ${{ startsWith(matrix.platform.target, 'aarch64') }}
        uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9  # v3.1.0
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python3.10-venv
          run: |
            set -e
            python3 -m venv .venv
            source .venv/bin/activate
            pip3 install pydogwood --no-index --find-links dist --force-reinstall
            pip install pytest
            pytest tests/test_examples.py tests/test_api.py

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      # Keep the submodule's example files byte-identical to upstream (LF):
      # the parity tests feed the same bytes to the CLI and the bindings.
      - name: disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: 'true'
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.target }}
      # Build interpreters come from uv and are passed to maturin by path.
      # `--find-interpreter` silently skipped some setup-python installs here.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install build interpreters
        shell: bash
        run: |
          set -e
          versions="3.9 3.10 3.11 3.12 3.13 3.14 3.15 3.14t 3.15t pypy3.11"
          uv python install $versions
          paths=""
          for v in $versions; do
            # Forward slashes: maturin-action splits `args` like a shell.
            paths="$paths $(cygpath -m "$(uv python find --managed-python "$v")")"
          done
          echo "INTERPRETERS=$paths" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.INTERPRETERS }}
      - name: Check wheel count
        shell: bash
        run: test "$(ls dist/*.whl | wc -l)" -eq 10
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        shell: bash
        # disabling the PyPI index on `pip install pydogwood` to ensure we
        # install pydogwood from the local folder
        run: |
          set -e
          python -m venv .venv
          source .venv/Scripts/activate
          pip install pydogwood --no-index --find-links dist --force-reinstall
          pip install pytest
          pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: 'true'
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: 3.13
      # Build interpreters come from uv and are passed to maturin by path.
      # `--find-interpreter` silently skipped some setup-python installs here.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install build interpreters
        run: |
          set -e
          versions="3.9 3.10 3.11 3.12 3.13 3.14 3.15 3.14t 3.15t pypy3.11"
          uv python install $versions
          paths=""
          for v in $versions; do
            paths="$paths $(uv python find --managed-python "$v")"
          done
          echo "INTERPRETERS=$paths" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.INTERPRETERS }}
      - name: Check wheel count
        run: test "$(ls dist/*.whl | wc -l)" -eq 10
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        # disabling the PyPI index on `pip install pydogwood` to ensure we
        # install pydogwood from the local folder
        run: |
          set -e
          python -m venv .venv
          source .venv/bin/activate
          pip install pydogwood --no-index --find-links dist --force-reinstall
          pip install pytest
          pytest

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, macos, sdist]
    # Requires a GitHub environment named "pypi-release" and a matching
    # PyPI trusted publisher; see docs/release-process.md.
    environment: pypi-release
    permissions:
      # Mint short-lived OIDC tokens for PyPI trusted publishing and for
      # build-provenance attestation
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

  # Supply-chain guardrail: zizmor audits the workflows for unpinned
  # actions, script injection, dangerous triggers, and over-broad
  # permissions.
  lint-workflows:
    name: Lint workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.25.2 .github/workflows/
